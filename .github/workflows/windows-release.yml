name: Windows standalone EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Prepare build interpreter
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'texture-env'
          $build = Join-Path $env:RUNNER_TEMP 'texture-build'
          "TEXTURE_STUDIO_VENV=$venv" >> $env:GITHUB_ENV
          "TEXTURE_STUDIO_BUILD_ROOT=$build" >> $env:GITHUB_ENV
          python -m venv $venv
      - name: Test, build single EXE and validate without source or Python paths
        shell: cmd
        run: build_windows.bat
      - name: Keep validated executable and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TextureStudio-Windows-x64
          path: ${{ runner.temp }}/texture-build/release/*
          if-no-files-found: error
      - name: Publish validated Windows download
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TS_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TS_RELEASE_TAG
          $files = Join-Path $env:TEXTURE_STUDIO_BUILD_ROOT 'release'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title "Texture Studio $tag" --notes "Windows x64 standalone EXE. No Python installation required. Windows tests and isolated GUI/image-export checks passed."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag "$files/TextureStudio.exe" "$files/TextureStudio-Windows-x64.zip" "$files/TextureStudio.exe.sha256" "$files/windows-validation.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
